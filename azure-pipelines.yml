trigger:
  branches:
    include: [main]
pr: none
pool:
  name: Default
  demands:
    - Agent.Name -equals rikeli-local
    - docker
jobs:
  - job: Validar
    displayName: '37 API y 23 pruebas automatizadas'
    timeoutInMinutes: 30
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Node.js 22'
      - script: node scripts/ci/run.cjs
        displayName: 'Ejecutar las 60 verificaciones en Docker aislado'
      - powershell: '& ./scripts/ci/normalize-junit.ps1 -ReportPath ./test-results/unitarios.xml'
        condition: succeededOrFailed()
        displayName: 'Preparar JUnit de los 23 casos para Azure'
      - task: PublishTestResults@2
        displayName: 'Publicar las 37 comprobaciones API'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'test-results/api.xml'
          testRunTitle: 'XRE Docs - 37 comprobaciones API'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          failTaskOnFailureToPublishResults: true
      - task: PublishTestResults@2
        displayName: 'Publicar las 23 pruebas automatizadas'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'test-results/unitarios.xml'
          testRunTitle: 'XRE Docs - 23 pruebas automatizadas'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          failTaskOnFailureToPublishResults: true
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: 'test-results'
          artifact: 'resultados-pruebas'
        displayName: 'Guardar reportes JUnit y resultados JSON'
